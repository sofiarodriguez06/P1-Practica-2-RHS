<!DOCTYPE html>
<html lang="en">

<!-- Configura la codificacion y el titulo del documento -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes en HTML</title>
</head>

<body>

    <!-- Muestra el titulo principal de la pagina -->
    <h2>Imagenes en HTML</h2>

    <!-- Subtitulo para indicar que las imagenes estan guardadas en el mismo equipo o proyecto -->
    <h3>Locales</h3>

    <!-- Muestra una imagen local ubicada en la misma carpeta y usa alt para el texto alternativo -->
    <img src="caritas.png" alt="Imagen de carita feliz">

    <!-- Subtitulo para indicar que la imagen local se va a cambiar de tamano -->
    <h3>Locales redismensionado</h3>

    <!-- Carga una imagen desde la subcarpeta imagenes y usa width y height para definir su ancho y alto -->
    <img src="imagenes/carita.png" alt="" width="200" height="100">

    <!-- Subtitulo para indicar que la imagen se obtiene directamente desde un enlace web externo -->
    <h3>Desde internet</h3>

    <!-- Carga una imagen de internet mediante una URL fija y ajusta su tamano en pixeles -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">

    <!-- Subtitulo para la seccion de imagenes animadas -->
    <h3>Animaciones</h3>

    <!-- Inserta un archivo GIF animado traido desde internet ajustando su ancho y alto -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">

</body>
</html>
